# Based on the official Milvus v2.5.16 release compose; all host ports are local only.
# Source: https://github.com/milvus-io/milvus/blob/v2.5.16/deployments/docker/standalone/docker-compose.yml
services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes: ["mbcc_etcd:/etcd"]
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: [CMD, etcdctl, endpoint, health]
      interval: 30s
      timeout: 20s
      retries: 3
  minio:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    environment:
      MINIO_ACCESS_KEY: ${MBCC_MINIO_USER:?Set local-only MinIO user in environment}
      MINIO_SECRET_KEY: ${MBCC_MINIO_PASSWORD:?Set local-only MinIO password in environment}
    volumes: ["mbcc_minio:/minio_data"]
    command: minio server /minio_data
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9000/minio/health/live]
      interval: 30s
      timeout: 20s
      retries: 3
  standalone:
    image: milvusdb/milvus:v2.5.16
    command: [milvus, run, standalone]
    security_opt: ["seccomp:unconfined"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_REGION: us-east-1
      MINIO_ACCESS_KEY_ID: ${MBCC_MINIO_USER:?Set environment}
      MINIO_SECRET_ACCESS_KEY: ${MBCC_MINIO_PASSWORD:?Set environment}
    volumes: ["mbcc_milvus:/var/lib/milvus"]
    ports: ["127.0.0.1:19530:19530", "127.0.0.1:9091:9091"]
    depends_on:
      etcd: {condition: service_healthy}
      minio: {condition: service_healthy}
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9091/healthz]
      interval: 30s
      timeout: 20s
      start_period: 90s
      retries: 3
volumes:
  mbcc_etcd:
  mbcc_minio:
  mbcc_milvus:
